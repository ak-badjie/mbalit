<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="trkGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1FA653"/>
      <stop offset="100%" stop-color="#0E7A3B"/>
    </linearGradient>
  </defs>

  <!-- Distant buildings -->
  <g opacity="0.18">
    <rect x="10" y="50" width="30" height="130" fill="#0E7A3B"/>
    <rect x="45" y="30" width="25" height="150" fill="#0E7A3B"/>
    <rect x="75" y="60" width="35" height="120" fill="#0E7A3B"/>
    <rect x="240" y="40" width="30" height="140" fill="#0E7A3B"/>
    <rect x="275" y="60" width="25" height="120" fill="#0E7A3B"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.7">
    <ellipse cx="60" cy="35" rx="22" ry="7" fill="#FFFFFF"/>
    <ellipse cx="250" cy="25" rx="28" ry="8" fill="#FFFFFF"/>
  </g>

  <!-- Bird -->
  <path d="M150 30 Q155 26 160 30 Q165 26 170 30" stroke="#0E7A3B" stroke-width="2" fill="none"/>

  <!-- Tree -->
  <g transform="translate(20, 110)">
    <ellipse cx="20" cy="40" rx="20" ry="35" fill="#1FA653"/>
  </g>

  <!-- Green bin -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="35" height="50" rx="4" fill="#1FA653"/>
    <rect x="-2" y="-3" width="39" height="6" rx="2" fill="#0E7A3B"/>
    <path d="M12 20 L24 20 L18 30 L12 30 L24 30 L18 40" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>

  <!-- Truck cab -->
  <rect x="110" y="125" width="90" height="70" rx="8" fill="#FFFFFF" stroke="#0E7A3B" stroke-width="2"/>
  <path d="M120 135 L190 135 L190 160 L120 160 Z" fill="#CFE9D9"/>
  <rect x="153" y="135" width="4" height="25" fill="#FFFFFF"/>

  <!-- Truck body -->
  <rect x="200" y="105" width="100" height="90" rx="6" fill="url(#trkGreen)"/>
  <path d="M300 105 L315 125 L315 195 L300 195 Z" fill="#0E7A3B"/>

  <!-- Recycle on body -->
  <g transform="translate(232, 130)">
    <circle cx="18" cy="20" r="18" fill="#FFFFFF" opacity="0.2"/>
    <path d="M18 10 L26 22 L21 22 L21 30 L15 30 L15 22 L10 22 Z" fill="#FFFFFF"/>
  </g>

  <!-- Wheels -->
  <circle cx="135" cy="200" r="14" fill="#1A1A1A"/>
  <circle cx="135" cy="200" r="6" fill="#9CA3AF"/>
  <circle cx="240" cy="200" r="14" fill="#1A1A1A"/>
  <circle cx="240" cy="200" r="6" fill="#9CA3AF"/>
  <circle cx="278" cy="200" r="14" fill="#1A1A1A"/>
  <circle cx="278" cy="200" r="6" fill="#9CA3AF"/>

  <!-- Ground -->
  <line x1="0" y1="218" x2="320" y2="218" stroke="#0E7A3B" stroke-width="2" opacity="0.3"/>
</svg>
