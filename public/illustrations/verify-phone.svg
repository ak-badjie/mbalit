    <path d="M40 220 Q55 200 75 215 Q60 230 40 220 Z" fill="#16903E"/>
    <path d="M55 250 Q70 230 90 245 Q75 260 55 250 Z" fill="#1FA653"/>
    <path d="M250 70 Q265 50 285 65 Q270 80 250 70 Z" fill="#1FA653"/>
  </g>

  <!-- Paper plane -->
  <g transform="translate(240, 50)">
    <path d="M0 8 L24 0 L18 18 L10 14 L8 22 Z" fill="#1FA653"/>
  </g>

  <!-- Phone -->
  <g transform="translate(110, 40)">
    <rect x="0" y="0" width="120" height="220" rx="22" fill="#FFFFFF" stroke="#0E7A3B" stroke-width="3"/>
