    <!-- Speaker notch -->
    <rect x="48" y="6" width="24" height="4" rx="2" fill="#0E7A3B"/>

    <!-- M Logo centered -->
    <g transform="translate(30, 60) scale(0.5)">
      <path d="M10 130 L10 30 Q10 10 30 10 L45 10 Q55 10 60 25 L60 75 L60 25 Q65 10 75 10 L90 10 Q110 10 110 30 L110 130 L88 130 L88 45 L75 75 L60 75 L45 75 L32 45 L32 130 Z" fill="#0E7A3B"/>
      <path d="M60 38 C72 38 82 48 82 60 C82 76 60 100 60 100 C60 100 38 76 38 60 C38 48 48 38 60 38 Z" fill="#0E7A3B"/>
      <circle cx="60" cy="60" r="9" fill="#FFFFFF"/>
    </g>

    <text x="60" y="170" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#0E7A3B">MbalitApp</text>
  </g>

  <!-- Shield with checkmark -->
  <g transform="translate(210, 170)">
    <path d="M0 0 L40 0 L40 30 Q40 50 20 60 Q0 50 0 30 Z" fill="#1FA653"/>
    <path d="M10 30 L17 38 L30 22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
