<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <!-- Phone -->
  <rect x="60" y="20" width="80" height="120" rx="14" fill="#1FA653"/>
  <rect x="68" y="32" width="64" height="96" rx="8" fill="#E8F6EE"/>

  <!-- $ sign on phone screen -->
  <text x="100" y="92" font-family="sans-serif" font-weight="800" font-size="40" text-anchor="middle" fill="#0E7A3B">$</text>

  <!-- Floating bills -->
  <g transform="rotate(-12 40 60)">
    <rect x="20" y="40" width="40" height="25" rx="3" fill="#5FC587"/>
    <rect x="24" y="44" width="32" height="17" rx="2" fill="#A6E0C0" opacity="0.5"/>
    <circle cx="40" cy="52" r="4" fill="#5FC587"/>
  </g>
  <g transform="rotate(15 160 110)">
    <rect x="140" y="90" width="40" height="25" rx="3" fill="#5FC587"/>
    <rect x="144" y="94" width="32" height="17" rx="2" fill="#A6E0C0" opacity="0.5"/>
    <circle cx="160" cy="102" r="4" fill="#5FC587"/>
  </g>

  <!-- Paper plane -->
  <g transform="translate(155, 30)">
    <path d="M0 8 L24 0 L18 18 L10 14 L8 22 Z" fill="#1FA653"/>
  </g>

  <!-- Sparkles -->
  <circle cx="35" cy="20" r="3" fill="#5FC587"/>
  <circle cx="180" cy="80" r="2" fill="#5FC587"/>
  <circle cx="50" cy="130" r="2" fill="#5FC587"/>
</svg>
